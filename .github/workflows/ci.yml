name: CI

on:
  pull_request:
    branches: [ dev ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 升级pip
        run: python -m pip install --upgrade pip

      - name: 后端测试占位
        run: echo "后端CI流程占位，测试后续补充"
