name: CI

on:
  pull_request:
    branches: [ dev ]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装前端依赖
        run: npm install

      - name: 前端测试
        run: echo "前端测试占位"

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./后端
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 升级pip
        run: python -m pip install --upgrade pip

      - name: 安装后端项目依赖
        run: python -m pip install -r requirements.txt

      - name: 后端 pytest 测试
        run: echo "后端测试占位"
