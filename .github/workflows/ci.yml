name: CI
on:
  pull_request:
    branches: [ dev ]
  push:
    branches: [ dev ]

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安装前端依赖
        run: npm install

      - name: 代码规范检查 lint
        run: npm run lint

      - name: 前端打包构建
        run: npm run build

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 后端单元测试
        run: pytest
